name: buildbot

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v4
        with:
          ref: 'master'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build python CI
        run: |
          sudo apt-get -q update
          sudo apt-get install -y dos2unix gettext
          pip install --upgrade pip autopep8
          ./CI/build.sh
